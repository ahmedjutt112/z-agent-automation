# ============================================================================
# Frontend nginx site config (used by apps/desktop/Dockerfile stage 2)
# ----------------------------------------------------------------------------
# This is the nginx config INSIDE the frontend container. It serves the Vite
# bundle as a SPA. The repo-root nginx.conf is a SEPARATE reverse-proxy config
# that forwards `/` → frontend:80 (this server).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: serve index.html for any path that doesn't match a
    # static file. This is required because the renderer uses react-router-dom
    # with client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits hashed filenames under /assets/*, so they can be cached
    # aggressively (1y). The fingerprint in the filename changes when the
    # content changes, busting the cache automatically.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must NEVER be cached, or users get stale JS bundles
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Gzip on for the textual asset types Vite emits.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
