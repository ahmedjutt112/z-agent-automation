# ============================================================================
# nginx.conf — reverse proxy for the AI Automation Agent
# ----------------------------------------------------------------------------
# Mounted into the `nginx` service in docker-compose.yml at
# /etc/nginx/nginx.conf. Forwards:
#
#   /                                  → frontend:80       (Vite renderer SPA)
#   /api/                              → backend:8765      (FastAPI REST)
#   /docs                              → backend:8765/docs  (OpenAPI Swagger UI)
#   /events                            → backend:8765      (WebSocket)
#   /logs/stream                       → backend:8765      (WebSocket)
#   /voice/stream                      → backend:8765      (WebSocket)
#   /oauth/{provider}/callback         → backend:8765      (OAuth redirects)
#
# NOTE: the /api prefix is intentionally NOT stripped — the FastAPI app
# mounts its routers at the root (e.g. /workflow, /schedules), so we proxy
# /api/* → backend:8765/* verbatim and the frontend calls /api/workflow etc.
# The frontend code in apps/desktop/renderer/src/lib/api.ts builds paths as
# `${BASE}/workflow` where BASE defaults to "/api" — so the public path
# /api/workflow arrives at backend as /api/workflow, which FastAPI doesn't
# match. To keep the prefix-stripping behavior visible to API consumers, the
# location block uses a regex capture to rewrite /api/(.*) → /$1 on the way
# to the backend.
# ============================================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    # epoll is Linux-only; the default nginx:alpine image already picks it.
    multi_accept on;
}

http {
    # ------------------------------------------------------------------
    # Basic MIME + logging
    # ------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ------------------------------------------------------------------
    # Gzip — only for textual responses (JSON, JS, CSS, SVG).
    # Already-gzipped assets (images, fonts) are skipped to save CPU.
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        font/woff
        font/woff2;

    # ------------------------------------------------------------------
    # Upstreams — the backend + frontend services in the compose network.
    # ------------------------------------------------------------------
    upstream backend_upstream {
        server backend:8765;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 32;
    }

    # ------------------------------------------------------------------
    # WebSocket connection upgrade map (used by /events, /logs/stream,
    # /voice/stream — see the location blocks below).
    # ------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------
    # HTTP server — redirects to HTTPS in production.
    # In local dev (no certs), comment out the SSL parts and listen on :80.
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # File uploads — workflow JSON imports + screenshot uploads can be
        # sizable. 50 MB is a generous ceiling; raise if you need to upload
        # raw video captures through the recorder.
        client_max_body_size 50M;

        # Security headers — applied to every response from this vhost.
        # HSTS is intentionally NOT set on the :80 vhost (it would lock
        # browsers into HTTPS before the cert is in place). The :443 vhost
        # below sets the full HSTS policy.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # --------------------------------------------------------------
        # Reverse-proxy helpers (shared by /api + /docs + /oauth + /events
        # + /logs/stream + /voice/stream).
        # --------------------------------------------------------------
        # Strip the /api prefix on the way to the backend so that
        # GET /api/workflow  → backend:8765/workflow
        # POST /api/workflow → backend:8765/workflow
        # This matches how the frontend's api.ts builds URLs (BASE="/api"
        # + "/workflow").
        location ~ ^/api/(.*)$ {
            proxy_pass http://backend_upstream/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # OpenAPI Swagger UI — no prefix stripping.
        location = /docs {
            proxy_pass http://backend_upstream/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenAPI JSON schema — used by codegen + the Swagger UI loader.
        location = /openapi.json {
            proxy_pass http://backend_upstream/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # OAuth callbacks — providers redirect here after the user consents.
        # No prefix stripping: the path /oauth/google/callback must arrive at
        # the backend verbatim because the redirect_uri registered with
        # Google/GitHub/Facebook is /oauth/<provider>/callback.
        location /oauth/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # --------------------------------------------------------------
        # WebSocket endpoints — master prompt §77 (event bus),
        # §38/§73 (logs streaming), voice pipeline (§83).
        # --------------------------------------------------------------
        # /events — live event stream (plan created, task progress, etc.)
        location = /events {
            proxy_pass http://backend_upstream/events;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 1h idle timeout — matches the master prompt §77 spec for
            # long-lived event subscriptions.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # /logs/stream — tail of the audit + debug log (master prompt §73).
        location = /logs/stream {
            proxy_pass http://backend_upstream/logs/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # /voice/stream — bidirectional voice STT/TTS stream (§83).
        location = /voice/stream {
            proxy_pass http://backend_upstream/voice/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --------------------------------------------------------------
        # Default — frontend SPA. `try_files` falls back to index.html so
        # react-router-dom's client-side routing works on deep links.
        # --------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }

    # ------------------------------------------------------------------
    # HTTPS server — only active when SSL certs are mounted.
    # Comment this entire server block out for local dev.
    # ------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 50M;

        # Full HSTS — only set on HTTPS so first-visit HTTP→HTTPS redirects
        # work without pinning users to a cert they don't have yet.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Same location blocks as :80 — kept DRY by NOT using includes here
        # so the file remains a single self-contained config (matches the
        # single-file nginx.conf spec the tests check).
        location ~ ^/api/(.*)$ {
            proxy_pass http://backend_upstream/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location = /docs {
            proxy_pass http://backend_upstream/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://backend_upstream/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /oauth/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location = /events {
            proxy_pass http://backend_upstream/events;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /logs/stream {
            proxy_pass http://backend_upstream/logs/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /voice/stream {
            proxy_pass http://backend_upstream/voice/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
